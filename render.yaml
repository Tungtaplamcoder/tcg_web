# =============================================================================
# Render Blueprint for TCG E-Commerce Platform
# =============================================================================
# Production-ready configuration for Render deployment
# Includes: PostgreSQL, Backend (Docker), Frontend (Docker)
# Migrations run via preDeployCommand on backend service
# =============================================================================

services:
  # -----------------------------------------------------------------------------
  # Backend API Server (Docker)
  # -----------------------------------------------------------------------------
  - type: web
    name: tcg-backend
    plan: starter
    region: oregon
    runtime: docker
    repo: https://github.com/YOUR_USERNAME/tcg-ecommerce
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeploy: true
    healthCheckPath: /health
    # Run migrations before starting the service
    preDeployCommand: "npx prisma migrate deploy"
    envVars:
      # Application
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      # Database - DATABASE_URL is auto-injected from the PostgreSQL database below
      - key: DATABASE_URL
        fromDatabase:
          name: tcg-postgres
          property: connectionString
      - key: DATABASE_SSL_MODE
        value: "require"
      # JWT Authentication
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      # SePay Payment Gateway
      - key: SEPAY_API_URL
        value: "https://my.sepay.vn"
      - key: SEPAY_ENV
        value: "production"
      - key: SEPAY_MERCHANT_ID
        sync: false
      - key: SEPAY_MERCHANT_SECRET_KEY
        sync: false
      # Public domains — SePay callbacks + CORS (no hardcoded hosts)
      - key: NEXT_PUBLIC_APP_URL
        value: "https://tcg-frontend.onrender.com"
      - key: NEXT_PUBLIC_API_URL
        value: "https://tcg-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://tcg-frontend.onrender.com"
      # Email (SMTP)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_HOSTNAME
        sync: false
      # Admin
      - key: ADMIN_EMAIL
        value: "admin@tcg.com"
      - key: ADMIN_PASSWORD
        sync: false
      # Image Upload
      - key: IMGBB_API_KEY
        sync: false

  # -----------------------------------------------------------------------------
  # Frontend (Vite/React + Nginx) (Docker)
  # -----------------------------------------------------------------------------
  - type: web
    name: tcg-frontend
    plan: starter
    region: oregon
    runtime: docker
    repo: https://github.com/YOUR_USERNAME/tcg-ecommerce
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://tcg-backend.onrender.com/api/v1"
      - key: NEXT_PUBLIC_APP_URL
        value: "https://tcg-frontend.onrender.com"
      - key: NEXT_PUBLIC_SOCKET_URL
        value: "https://tcg-backend.onrender.com"
      - key: VITE_API_URL
        value: "https://tcg-backend.onrender.com/api/v1"
      - key: VITE_APP_URL
        value: "https://tcg-frontend.onrender.com"
      - key: VITE_SOCKET_URL
        value: "https://tcg-backend.onrender.com"
      - key: VITE_ENABLE_CHAT
        value: "true"
      - key: VITE_ENABLE_PAYMENT
        value: "true"
      - key: VITE_ENABLE_WISHLIST
        value: "false"

# -----------------------------------------------------------------------------
# Databases
# -----------------------------------------------------------------------------
databases:
  - name: tcg-postgres
    databaseName: tcg_db
    plan: starter
    region: oregon
    postgresMajorVersion: "16"

# =============================================================================
# NOTES:
# =============================================================================
# 1. Replace YOUR_USERNAME with your actual GitHub username
# 2. Secrets (sync: false) must be set manually in Render Dashboard:
#    - JWT_ACCESS_SECRET, JWT_REFRESH_SECRET
#    - SEPAY_MERCHANT_ID, SEPAY_MERCHANT_SECRET_KEY
#    - SMTP_HOST, SMTP_USER, SMTP_PASS, SMTP_HOSTNAME
#    - ADMIN_PASSWORD, IMGBB_API_KEY
# 3. DATABASE_URL is automatically injected from the PostgreSQL database
# 4. Migrations run automatically via preDeployCommand on every deploy
# 5. For manual seeding, use Render Shell: `npx prisma db seed` or `node prisma/seed.js`
# 6. Render provides free SSL (https://tcg-frontend.onrender.com, https://tcg-backend.onrender.com)
# 7. For custom domains, add them in Render Dashboard > Settings > Custom Domains,
#    then update NEXT_PUBLIC_APP_URL / NEXT_PUBLIC_API_URL / CORS_ALLOWED_ORIGINS above