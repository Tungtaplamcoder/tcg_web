<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Thanh Toán TCG Store</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 15px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #qr-container { margin-top: 20px; display: none; }
        img { width: 220px; height: 220px; border: 1px solid #ddd; border-radius: 8px; }
        .status { margin-top: 15px; font-size: 16px; font-weight: bold; color: #ff9800; }
        .success { color: #28a745; font-size: 18px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Đơn Hàng TCG Test</h2>
        <p>Sản phẩm: <strong>Thẻ bài Pokémon / Yugioh</strong></p>
        <p>Số tiền: <strong style="color: #d9534f;">2.000 VNĐ</strong></p>
        
        <button id="btn-pay" onclick="createPayment()">TẠO MÃ VIETQR</button>

        <div id="qr-container">
            <p style="margin-bottom: 8px; font-size: 14px; color: #666;">Quét mã bằng App Ngân Hàng:</p>
            <img id="qr-img" src="" alt="VietQR Code">
            <div id="status-text" class="status">Đang chờ thanh toán... ⏳</div>
        </div>
    </div>

    <script>
        let pollInterval = null;

        async function createPayment() {
            const btn = document.getElementById('btn-pay');
            btn.disabled = true;
            btn.innerText = 'Đang khởi tạo mã...';

            try {
                // Gọi API backend tạo link thanh toán
                const response = await fetch('http://localhost:5000/api/payment/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: 2000, description: 'Test Don Hang TCG' })
                });

                const result = await response.json();

                if (result.success) {
                    btn.innerText = 'Mã QR đã sẵn sàng';
                    document.getElementById('qr-container').style.display = 'block';
                    document.getElementById('qr-img').src = result.data.qrCodeUrl;

                    // Bắt đầu kiểm tra trạng thái tự động liên tục mỗi 2 giây
                    startPolling(result.data.orderCode);
                } else {
                    alert('Lỗi: ' + result.error);
                    btn.disabled = false;
                    btn.innerText = 'TẠO MÃ VIETQR';
                }
            } catch (error) {
                alert('Không kết nối được tới Backend (localhost:5000)!');
                btn.disabled = false;
                btn.innerText = 'TẠO MÃ VIETQR';
            }
        }

        function startPolling(orderCode) {
            pollInterval = setInterval(async () => {
                try {
                    const res = await fetch(`http://localhost:5000/api/payment/${orderCode}`);
                    const data = await res.json();

                    // Ngay khi Webhook payOS báo về backend status = PAID
                    if (data.success && data.localStatus === 'PAID') {
                        clearInterval(pollInterval); // Dừng gửi request check
                        
                        const statusEl = document.getElementById('status-text');
                        statusEl.innerText = '🎉 THANH TOÁN THÀNH CÔNG!';
                        statusEl.className = 'status success';
                        document.getElementById('qr-img').style.opacity = '0.3';
                    }
                } catch (err) {
                    console.error('Check status error:', err);
                }
            }, 2000); // 2 giây check 1 lần
        }
    </script>
</body>
</html>
