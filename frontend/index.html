<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TCG Store — Premium Pokémon TCG singles, sealed booster boxes and rare collectibles. Authenticated, graded and shipped with care." />
    <title>TCG Store — Premium Pokémon TCG & Booster Boxes</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23e11d48'/%3E%3Cpath d='M50 8 a42 42 0 0 1 0 84 z' fill='%23f472b6'/%3E%3Crect x='8' y='44' width='84' height='12' rx='6' fill='white'/%3E%3Ccircle cx='50' cy='50' r='14' fill='white'/%3E%3Ccircle cx='50' cy='50' r='7' fill='%23e11d48'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tcg-theme');
          var dark = stored ? stored === 'dark'
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
          root.classList.add('theme-boot');
        } catch (e) { /* no-op */ }
      })();
    </script>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdfbf7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#120b0e" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
