# =============================================================================
# Docker Compose for TCG E-Commerce Platform (zero-config, single command)
# =============================================================================
# Usage:
#   docker compose up -d --build      # start everything
#   docker compose ps                 # view health
#   docker compose down               # stop
# SSL is optional: docker compose --profile ssl up -d certbot
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: tcg_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tcg_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tcg_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tcg-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend API (Node.js + Prisma)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: tcg_backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-4000}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      SEPAY_API_URL: ${SEPAY_API_URL:-https://my.sepay.vn}
      SEPAY_ENV: ${SEPAY_ENV:-sandbox}
      SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID}
      SEPAY_MERCHANT_SECRET_KEY: ${SEPAY_MERCHANT_SECRET_KEY}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}
      SEPAY_ACCOUNT_NUMBER: ${SEPAY_ACCOUNT_NUMBER:-}
      SEPAY_ACCOUNT_NAME: ${SEPAY_ACCOUNT_NAME:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_HOSTNAME: ${SMTP_HOSTNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tcg.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      IMGBB_API_KEY: ${IMGBB_API_KEY}
    volumes:
      - backend_uploads:/app/public/uploads
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tcg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => { if (r.statusCode !== 200) process.exit(1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Frontend (Vite/React build served by Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost}
        VITE_PORT: ${VITE_PORT:-3000}
        VITE_ENABLE_CHAT: ${VITE_ENABLE_CHAT:-true}
        VITE_ENABLE_PAYMENT: ${VITE_ENABLE_PAYMENT:-true}
        VITE_ENABLE_WISHLIST: ${VITE_ENABLE_WISHLIST:-false}
    container_name: tcg_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - tcg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Nginx reverse proxy (port 80 entrypoint for the whole stack)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: tcg_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - tcg-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Certbot (optional SSL) — only runs with: docker compose --profile ssl up -d certbot
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: tcg_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - nginx
    command: >-
      certbot certonly --webroot
      --webroot-path=/var/www/certbot
      --email admin@tcg.local
      --agree-tos
      --no-eff-email
      --domains localhost
    profiles:
      - ssl
    restart: "no"

networks:
  tcg-network:
    driver: bridge
    name: tcg-network

volumes:
  postgres_data:
    name: tcg_postgres_data
  backend_uploads:
    name: tcg_backend_uploads
